# CI verification for the Astro migration — see MIGRATION_VERIFICATION.md.
#
# structure job: regenerates everything from index.html and fails on drift
#   (generated files hand-edited, or index.html changed without re-running the
#   pipeline), then runs the fast checks (layer 1 structural, layer 5 data).
# behavior job: seeded-PRNG old-vs-new comparison (layer 2), screenshot and
#   localStorage continuity checks (layers 3+4) under Playwright/Chromium.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  structure:
    name: pipeline drift + L1 structure + L5 data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase 4 froze the index.html baseline: app code is hand-maintained now,
      # so the old regenerate-and-diff drift check is retired (scripts archived
      # under verify/archive/).
      - run: npm run build
      - name: Layer 1 — structural equivalence vs index.html
        run: npm run verify:structure
      - name: Layer 5 — per-constant data deep-equal
        run: npm run verify:data

  behavior:
    name: L2 behavior + L3 visual + L4 storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # real CJK glyphs so the screenshot comparison exercises actual text
      # rendering (both sides share the runner's fonts either way)
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Layer 2 — seeded behavioral comparison (100 scenarios)
        run: npm run verify:behavior
      - name: Layers 3+4 — visual regression + localStorage continuity
        run: npm run verify:visual
