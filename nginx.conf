server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ~860KB of Japanese text ships in the JS — never serve without a charset
    charset utf-8;

    # app.js / data/*.js are NOT content-hashed: force revalidation so data
    # updates reach returning users; ETag/Last-Modified keep 304s cheap
    add_header Cache-Control "no-cache";

    # the single page + ~1MB of JS compress well
    gzip on;
    gzip_types text/javascript application/javascript text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
